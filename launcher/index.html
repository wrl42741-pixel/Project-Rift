<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Rift Launcher</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;background:linear-gradient(180deg,rgba(5,10,22,.2),rgba(5,10,22,.92)),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2000&q=85') center/cover no-repeat,#101522;color:white;font-family:Arial,sans-serif}
.brand{position:absolute;top:34px;left:42px;font-size:25px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 12px #000}
.subtitle{position:absolute;top:72px;left:44px;color:#c6d1e5;font-size:12px;letter-spacing:4px}
nav{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);width:max-content;max-width:96vw;display:flex;align-items:center;justify-content:center;gap:clamp(12px,2.4vw,34px);padding:16px 24px;background:rgba(10,16,30,.86);border:1px solid rgba(180,205,255,.25);border-radius:14px;box-shadow:0 10px 40px #0008;backdrop-filter:blur(12px)}
.nav-item{color:#d9e4f7;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex-shrink:0;min-width:max-content;font-size:13px;font-weight:700;white-space:nowrap;transition:color .15s,transform .15s}
.nav-item:hover,.nav-item.active{color:#fff;transform:translateY(-2px)}
.nav-item.active:after{content:"";height:3px;width:28px;background:#65b8ff;border-radius:3px}
.nav-item svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:650px){nav{gap:12px;padding:12px;max-width:98vw}.nav-item{font-size:10px}.nav-item svg{width:20px;height:20px}}
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#080d1cdd,#080d1cf5),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2000&q=85') center/cover">
  <div style="width:min(420px,90vw);padding:42px 32px;text-align:center;background:#111a2bea;border:1px solid #ffffff30;border-radius:18px;box-shadow:0 20px 70px #0009">
    <div style="font-size:30px;font-weight:900;letter-spacing:3px">PROJECT RIFT</div>
    <p style="color:#b9c8df;margin:12px 0 30px">CHAPTER 4 · SEASON 2</p>
    <h2 style="margin-bottom:10px">Welcome back</h2>
    <p style="color:#b9c8df;font-size:14px;margin-bottom:26px">Sign in with your Discord account to continue.</p>
    <button id="discordLogin" style="width:100%;padding:15px;border:0;border-radius:9px;background:#5865F2;color:white;font-size:15px;font-weight:bold;cursor:pointer">Continue with Discord</button>
    <p id="login-status" style="color:#b9c8df;font-size:12px;margin-top:18px"></p>
  </div>
</div>
<div class="brand">PROJECT RIFT</div>
<div id="discord-user" style="position:absolute;top:20px;right:28px;display:none;align-items:center;gap:10px;padding:7px 12px;border:1px solid #ffffff25;border-radius:25px;background:#10182dcc">
  <span id="discord-username" style="font-size:13px;font-weight:bold"></span>
  <img id="discord-avatar" alt="Discord profile" style="width:34px;height:34px;border-radius:50%;object-fit:cover">
</div>

<div class="subtitle">CHAPTER 4 · SEASON 2</div>
<nav aria-label="Main navigation">
<a class="nav-item active" href="#" data-page="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
<a class="nav-item" href="#" data-page="Library"><svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 6h8"/></svg><span>Library</span></a>
<a class="nav-item" href="#" data-page="Servers"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></svg><span>Servers</span></a>
<a class="nav-item" href="#" data-page="Shop"><svg viewBox="0 0 24 24"><path d="M3 3h2l2.5 12h11L21 7H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span>Shop</span></a>
<a class="nav-item" href="#" data-page="Download"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M4 17v4h16v-4"/></svg><span>Download</span></a>
<a class="nav-item" href="#" data-page="Leaderboard"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H3v2a4 4 0 0 0 4 4M17 6h4v2a4 4 0 0 1-4 4"/></svg><span>Leaderboard</span></a>
<a class="nav-item" href="#" data-page="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2 1-1.5 2.6-1.5-.6a8 8 0 0 1-2 .9l-.3 1.6h-3l-.3-1.6a8 8 0 0 1-2-.9l-1.5.6-1.5-2.6 1.2-1a8 8 0 0 1 0-2l-1.2-1 1.5-2.6 1.5.6a8 8 0 0 1 2-.9l.3-1.6h3l.3 1.6a8 8 0 0 1 2 .9l1.5-.6 1.5 2.6-1.2 1a8 8 0 0 1 0 2z" transform="translate(-1 -1)"/></svg><span>Settings</span></a>
</nav>
<script>
document.querySelectorAll('.nav-item').forEach(item=>item.addEventListener('click',e=>{
e.preventDefault();
document.querySelectorAll('.nav-item').forEach(link=>link.classList.remove('active'));
item.classList.add('active');
}));

const discordButton = document.getElementById('discordLogin');
const loginScreen = document.getElementById('login-screen');
const loginStatus = document.getElementById('login-status');

if (discordButton) {
  discordButton.addEventListener('click', async (event) => {
    event.preventDefault();
    discordButton.textContent = 'Opening Discord...';
    discordButton.disabled = true;
    loginStatus.textContent = 'Complete sign-in in your browser.';
    try {
      await window.discordAuth.login();
    } catch (error) {
      discordButton.textContent = 'Continue with Discord';
      discordButton.disabled = false;
      loginStatus.textContent = error.message || 'Could not start Discord login.';
    }
  });
}

if (window.discordAuth) {
  window.discordAuth.onSuccess(user => {
    const heading = document.querySelector('.login-title');
    const subtitle = document.querySelector('.login-sub');
    if (heading) heading.textContent = 'Welcome, ' + (user.global_name || user.username) + '!';
    if (subtitle) subtitle.textContent = 'Discord connected successfully';
    if (loginScreen) loginScreen.style.display = 'none';
    const userBox = document.getElementById('discord-user');
    const userName = document.getElementById('discord-username');
    const avatar = document.getElementById('discord-avatar');
    if (userName) userName.textContent = user.global_name || user.username;
    if (avatar) avatar.src = user.avatar
      ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`
      : `https://cdn.discordapp.com/embed/avatars/0.png`;
    if (userBox) userBox.style.display = 'flex';
  });

  window.discordAuth.onError(message => {
    if (loginStatus) loginStatus.textContent = message;
    if (discordButton) {
      discordButton.textContent = 'Continue with Discord';
      discordButton.disabled = false;
    }
  });
}
</script>
</body>
</html>
