name: Build and Release Project Rift

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: project-rift-v1
          name: Project Rift v1
          files: dist/*.exe
          make_latest: true
