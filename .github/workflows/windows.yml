name: Build and Release Project RIFT

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Project-RIFT-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: project-rift-v1
          name: Project RIFT v1
          files: dist/*.exe
          make_latest: true
