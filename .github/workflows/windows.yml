name: Build Project Rift for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run build

      - name: Upload Project Rift
        uses: actions/upload-artifact@v4
        with:
          name: Project-Rift-Windows
          path: dist/*.exe
